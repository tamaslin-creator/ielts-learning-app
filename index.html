<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IELTS Manager">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>IELTS Learning Manager</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--border:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
header{padding:max(18px,env(safe-area-inset-top)) 18px 10px;background:linear-gradient(180deg,#111827 0%,#1f2937 100%);color:#fff}
header h1{margin:8px 0 4px;font-size:28px} header p{margin:0;color:#cbd5e1;font-size:13px}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px rgba(17,24,39,.05)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px;border-radius:16px;background:#fff;border:1px solid var(--border)} .kpi small{color:var(--muted);display:block} .kpi b{font-size:24px;display:block;margin-top:5px}
.badge{font-size:12px;padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-weight:700}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px} .progress>div{height:100%;background:var(--blue);width:0}
.task{display:grid;grid-template-columns:38px 1fr 26px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f1f3} .task:last-child{border-bottom:0}
.icon{width:36px;height:36px;border-radius:12px;background:#eef2ff;display:grid;place-items:center;font-size:17px} .task strong{display:block;font-size:15px} .task span{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff} textarea{min-height:82px;resize:vertical}
.btn{width:100%;border:0;background:var(--blue);color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:15px}
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;backdrop-filter:blur(12px)} .nav button{border:0;background:transparent;padding:7px;color:#6b7280;font-size:11px} .nav button.active{color:var(--blue);font-weight:800}
.view{display:none} .view.active{display:block}
.score{display:grid;grid-template-columns:1fr 86px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f2f4} .score:last-child{border:0}
.listitem{padding:12px 0;border-bottom:1px solid #f1f2f4} .listitem:last-child{border:0} .listitem small{color:var(--muted)} .status{font-size:11px;padding:4px 8px;border-radius:999px} .done{background:#dcfce7;color:#166534} .late{background:#fee2e2;color:#991b1b} .todo{background:#f3f4f6;color:#4b5563}
</style>
</head>
<body>
<header>
  <h1>IELTS Learning</h1>
  <p>9–11 月 CLB 7 • 2027 CLB 9</p>
</header>

<main>
<section id="home" class="view active">
  <div class="kpis">
    <div class="kpi"><small>完成率</small><b id="pct">0%</b><div class="progress"><div id="pctbar"></div></div></div>
    <div class="kpi"><small>Backlog</small><b id="backlog">0m</b></div>
    <div class="kpi"><small>已學習</small><b id="actualh">0h</b></div>
    <div class="kpi"><small>連續天數</small><b id="streak">0</b></div>
  </div>

  <div class="card">
    <div class="row"><div><small style="color:var(--muted)">今日任務</small><h2 id="homeDate" style="margin:4px 0 0"></h2></div><span class="badge" id="homeMode"></span></div>
    <div id="homeTasks"></div>
    <div style="margin-top:12px">
      <input id="homeActual" type="number" min="0" placeholder="今天實際學習分鐘">
      <div style="height:8px"></div>
      <input id="homeCatchup" type="number" min="0" placeholder="今天補回 Backlog 分鐘">
      <div style="height:8px"></div>
      <button class="btn" onclick="saveHome()">完成今日打卡</button>
    </div>
  </div>
</section>

<section id="today" class="view">
  <div class="card">
    <div class="row"><h2 style="margin:0">每日管理</h2><span class="badge" id="todayMode"></span></div>
    <div style="height:12px"></div>
    <input type="date" id="datePicker" min="2026-09-01" max="2026-11-30">
    <div id="todayTasks" style="margin-top:8px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <input id="actualMin" type="number" min="0" placeholder="實際分鐘">
      <input id="catchupMin" type="number" min="0" placeholder="補課分鐘">
    </div>
    <div style="height:8px"></div>
    <select id="status"><option>Not Started</option><option>In Progress</option><option>Done</option><option>Skipped</option></select>
    <div style="height:8px"></div>
    <textarea id="note" placeholder="今天卡住什麼？明天要補什麼？"></textarea>
    <div style="height:8px"></div>
    <button class="btn" onclick="saveDay()">儲存</button>
  </div>
</section>

<section id="plan" class="view">
  <div class="card">
    <h2 style="margin-top:0">91 天計畫</h2>
    <input id="search" placeholder="搜尋日期或內容">
    <div id="planList"></div>
  </div>
</section>

<section id="scores" class="view">
  <div class="card">
    <h2 style="margin-top:0">CLB 進度</h2>
    <p style="color:var(--muted);font-size:13px">輸入最新 IELTS General 模考分數。</p>
    <div id="scoresList"></div>
    <button class="btn" onclick="saveScores()">儲存分數</button>
  </div>
  <div class="card">
    <strong>CLB 7</strong><p>Listening 6.0 • Reading 6.0 • Writing 6.0 • Speaking 6.0</p>
    <strong>CLB 9</strong><p>Listening 8.0 • Reading 7.0 • Writing 7.0 • Speaking 7.0</p>
  </div>
</section>
</main>

<nav class="nav">
  <button class="active" data-view="home">🏠<br>首頁</button>
  <button data-view="today">✅<br>今日</button>
  <button data-view="plan">📅<br>計畫</button>
  <button data-view="scores">🎯<br>CLB</button>
</nav>

const KEY='ielts_iphone_manager_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"scores":{}}');

const icons={grammar:'Aa',listening:'🎧',reading:'📖',writing:'✍️',speaking:'🎤',vocabulary:'🧠'};
function saveState(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()}
function getPlan(date){return plans.find(p=>p.date===date)||plans[0]}
function currentPlan(){
 const t=new Date().toISOString().slice(0,10);
 if(t<plans[0].date)return plans[0]; if(t>plans.at(-1).date)return plans.at(-1); return getPlan(t)
}
function taskHTML(p){
 return ['grammar','listening','reading','writing','speaking','vocabulary'].map(k=>`
 <div class="task"><div class="icon">${icons[k]}</div><div><strong>${k[0].toUpperCase()+k.slice(1)}</strong><span>${p[k]}</span></div><div>›</div></div>`).join('')
}
function plannedTotal(){return plans.reduce((a,p)=>a+p.target,0)}
function actualTotal(){return Object.values(state.days).reduce((a,x)=>a+(+x.actual||0),0)}
function backlog(){
 let b=0; for(const p of plans){const x=state.days[p.date]; if(!x)continue; b=Math.max(0,b+Math.max(0,p.target-(+x.actual||0))-(+x.catchup||0))} return b
}
function streak(){
 let s=0; const completed=plans.filter(p=>state.days[p.date]&&(+state.days[p.date].actual||0)>=p.target*.9).map(p=>p.date);
 for(let i=plans.length-1;i>=0;i--){if(completed.includes(plans[i].date))s++; else if(s>0)break} return s
}
function renderHome(){
 const p=currentPlan(),x=state.days[p.date]||{};
 const pct=Math.min(100,actualTotal()/plannedTotal()*100||0);
 document.getElementById('pct').textContent=pct.toFixed(0)+'%';document.getElementById('pctbar').style.width=pct+'%';
 document.getElementById('backlog').textContent=backlog()+'m';document.getElementById('actualh').textContent=(actualTotal()/60).toFixed(1)+'h';document.getElementById('streak').textContent=streak();
 document.getElementById('homeDate').textContent=p.date;document.getElementById('homeMode').textContent=p.mode;document.getElementById('homeTasks').innerHTML=taskHTML(p);
 document.getElementById('homeActual').value=x.actual||'';document.getElementById('homeCatchup').value=x.catchup||''
}
function saveHome(){
 const p=currentPlan(); state.days[p.date]=state.days[p.date]||{};
 state.days[p.date].actual=+document.getElementById('homeActual').value||0;
 state.days[p.date].catchup=+document.getElementById('homeCatchup').value||0;
 state.days[p.date].status='Done';saveState()
}
function renderDay(date){
 const p=getPlan(date),x=state.days[p.date]||{};
 datePicker.value=p.date;todayMode.textContent=p.mode;todayTasks.innerHTML=taskHTML(p);
 actualMin.value=x.actual||'';catchupMin.value=x.catchup||'';status.value=x.status||'Not Started';note.value=x.note||''
}
function saveDay(){
 state.days[datePicker.value]={actual:+actualMin.value||0,catchup:+catchupMin.value||0,status:status.value,note:note.value};saveState()
}
function renderPlan(q=''){
 q=q.toLowerCase(); planList.innerHTML=plans.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>{
 const x=state.days[p.date]; let cls='todo',txt='未開始'; if(x){if((+x.actual||0)>=p.target*.9){cls='done';txt='完成'} else {cls='late';txt='未完成'}}
 return `<div class="listitem"><div class="row"><div><strong>${p.date}</strong><br><small>${p.mode} • ${p.grammar} • ${p.listening}</small></div><span class="status ${cls}">${txt}</span></div></div>`
 }).join('')
}
const targets={Listening:[6,8],Reading:[6,7],Writing:[6,7],Speaking:[6,7]};
function renderScores(){
 scoresList.innerHTML=Object.entries(targets).map(([k,t])=>{
 const v=state.scores[k]??''; return `<div class="score"><div><strong>${k}</strong><div style="font-size:12px;color:var(--muted)">CLB7 ${t[0]} • CLB9 ${t[1]}</div></div><input id="sc_${k}" type="number" step=".5" min="0" max="9" value="${v}"></div>`
 }).join('')
}
function saveScores(){for(const k in targets)state.scores[k]=document.getElementById('sc_'+k).value;saveState()}
function renderAll(){renderHome();renderPlan(search?.value||'');renderScores();renderDay(datePicker?.value||currentPlan().date)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')})
datePicker.addEventListener('change',e=>renderDay(e.target.value));search.addEventListener('input',e=>renderPlan(e.target.value));

renderAll();
